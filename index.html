<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Explore a collection of beautiful nature photos and videos.">
        <title>Nature Photo Showcase</title>
    </head>
    <body>
        <header>
            <h1>Nature Photo Showcase</h1>
        </header>
        <main>
            <figure>
                <img src="imgs/image-1.jpg" alt="Tall green trees in a forest" width="300" height="500">
                <figcaption>A peaceful escape into nature</figcaption>
            </figure>
            <figure>
                <img src="imgs/image-2.jpg" alt="Colorful flowers blooming in a garden" width="500" height="600">
                <figcaption>Nature's beauty in every color.</figcaption>
            </figure>
            <figure>
                <img src="imgs/image-3.jpg" alt="Raindrops falling on a trees" width="400" height="500">
                <figcaption>A refreshing moment on a rainy day.</figcaption>
            </figure>
            <figure>
                <img src="imgs/image-4.avif" alt="High mountains surrounded by clouds" width="400" height="550">
                <figcaption>A breathtaking view of the mountains.</figcaption>
            </figure>
            <figure>
                <img src="imgs/image-5.avif" alt="Blue sea with waves reaching the shore" width="400" height="500">
                <figcaption>The calming beauty of the sea.</figcaption>
            </figure>
            <figure>
                <img src="imgs/image-6.jpg" alt="" width="400" height="500">
            </figure>
            <video src="videos/nature-video.mp4" poster="imgs/nature-image.jpg" width="400" controls>
                Your browser does not support the video tag.
            </video>
        </main>
        <footer>
            <p>&copy; 2026 Nature Photo Showcase</p>
        </footer>
    </body>
</html>
